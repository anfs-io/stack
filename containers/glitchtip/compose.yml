# GlitchTip — self-hosted error tracking (Sentry-compatible).
#
# pcm service: uses the shared pcm postgres and valkey. Start with `pcm up glitchtip`,
# which starts them if needed, creates the `glitchtip` database, allocates a valkey
# db and injects PCM_POSTGRES_URL and PCM_VALKEY_URL.
# Every variable, with its default, lives in .env.schema.
# Secrets ship with an insecure dev-only default — override them for anything shared.

x-pcm:
  depends_on:
    postgres:
      database: glitchtip
    valkey: {}

services:
  web:
    image: ${GLITCHTIP_IMAGE}:${GLITCHTIP_TAG}
    ports:
      - "${GLITCHTIP_PORT}:8000"
    environment:
      DATABASE_URL: ${PCM_POSTGRES_URL}
      VALKEY_URL: ${PCM_VALKEY_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
      ENABLE_ADMIN: ${GLITCHTIP_ENABLE_ADMIN}
      ENABLE_OPENAPI: ${GLITCHTIP_ENABLE_OPENAPI}
      GLITCHTIP_ENABLE_MCP: ${GLITCHTIP_ENABLE_MCP}
      GLITCHTIP_ENABLE_DUCKDB: ${GLITCHTIP_ENABLE_DUCKDB}
      SERVER_ROLE: all_in_one
    restart: unless-stopped
    volumes:
      # :U chowns the host dir to the image's non-root `app` user (rootless podman)
      - ${PCM_VOLUMES_HOME}/glitchtip/uploads:/code/uploads:U
