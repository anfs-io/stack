# Traefik — reverse proxy for pcm ingress (https://traefik.io).
#
# pcm service: the proxy (x-pcm.provides: proxy). Services that declare
# x-pcm.ingress depend on it implicitly, so `pcm up <service>` starts it first.
# It routes each service's hosts to its container over the shared network,
# from the labels this definition's `labels` hook gives the container.
# Every variable, with its default, lives in .env.schema.

x-pcm:
  provides: proxy
  allow_mounts:
    # Podman API, read by Traefik's docker provider to discover routed containers
    - ${PCM_PODMAN_SOCKET}
  privileges:
    security_opt: >-
      label=disable: SELinux (enforcing in the podman machine and on Fedora) denies
      containers the podman API socket; Traefik's docker provider must read it to
      discover routed containers
  # Its own dashboard, at traefik.localhost (local only: never expose it without auth)
  ingress:
    port: 8080
    healthcheck: /ping

services:
  traefik:
    image: ${TRAEFIK_IMAGE}:${TRAEFIK_TAG}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Only containers pcm marked for ingress
      - --providers.docker.constraints=Label(`io.pcm.ingress`,`true`)
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      # Dashboard and API on the container's :8080, which is not published
      - --api.insecure=true
      - --ping=true
      - --log.level=${TRAEFIK_LOG_LEVEL}
    ports:
      - "${PROXY_BIND}:${PROXY_HTTP_PORT}:80"
      - "${PROXY_BIND}:${PROXY_HTTPS_PORT}:443"
    security_opt:
      - label=disable
    volumes:
      - ${PCM_PODMAN_SOCKET}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
