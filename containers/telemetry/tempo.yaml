# Monolithic Tempo 3.0 for local dev (`target: all`). Filesystem storage, OTLP
# receiver on :4317, query/HTTP API on :3200. Throwaway dev store.
#
# 3.0 architecture: monolithic mode runs the whole write path in-process
# (distributor -> block-builder -> live-store) with NO Kafka. Recent-data
# TraceQL-metrics are served by the live-store automatically -- no Prometheus
# and no `local-blocks` processor (both removed/unneeded in this stack). The
# 2.x `ingester:` and `compactor:` blocks are gone; compaction is driven by the
# backend scheduler. Blocks are written in the current format (vParquet4+); the
# store is fresh, so nothing to migrate.
target: all

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Short retention for a throwaway dev store. In 3.0 the compactor block is gone;
# block retention is expressed as a per-tenant override default.
overrides:
  defaults:
    compaction:
      block_retention: 1h
