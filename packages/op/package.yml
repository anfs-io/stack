version: 0.1.5
author: rjayroach
categories: [pde]
# macOS: the CLI ships as a cask next to the desktop app, for app integration and biometric unlock.
# Linux: the CLI comes from mise (op.toml, linux only below) — hosts there use service account tokens,
# which never touch the desktop app. Desktop-app integration on Linux would need op in
# /usr/local/bin, group onepassword-cli, setgid, which only 1Password's apt/dnf packages set up.
depends:
  # ssh provides the ssh() dispatcher this package registers its token-forwarding hook with,
  # and the `Include config.d/*.conf` line that 99-op.conf needs.
  - ssh
  # fnox resolves the service account token; the hook is inert without it.
  - fnox
cask:
  macos: [1password, 1password-cli]
# The 1Password agent socket is macOS's; the CLI from mise is Linux's (the cask has it on macOS)
links:
  - {path: .ssh/config.d/99-op.conf, platforms: [macos]}
  - {path: .config/mise/conf.d/op.toml, platforms: [linux]}
onboard:
  offer: "1Password as your password manager: your ssh key and GitHub token kept in a vault"
  steps:
    - name: pm
      summary: 1Password, and the vault for your credentials
    - name: pm-key
      summary: An ssh key kept in 1Password
      after: [pm]
    - name: pm-github
      summary: Your GitHub token kept in 1Password
      after: [github, repo, publish]
  options:
    - "--vault VAULT: The 1Password vault for your GitHub token and ssh key"
