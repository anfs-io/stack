# The Obsidian plugins `ovm init` places in a vault, at these versions (ovm help init). Each is
# downloaded once from its GitHub release (https://github.com/<repo>/releases/download/<version>/<asset>)
# into ~/.cache/ovm/plugins/<id>/<version>/ and checked against these sha256s.
#
# Bump: change version, then every sha256 (packages/obsidian/tests/pins fetches the assets and
# prints them; ovm's bats tests never reach the network). The key is the plugin's id, as its
# manifest.json has it. Checked 2026-10-22 (docs: units/ovm.md, "Obsidian, checked 2026-10-22").
