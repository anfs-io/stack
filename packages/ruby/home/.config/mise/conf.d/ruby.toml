[tools]
ruby = { version = "latest", postinstall = "{{ env.HOME }}/.local/share/mise/scripts/ruby-lsp.sh" }

[env]
# The gems mise installs with every ruby: a list packages add to (install_gem), so DATA, not config
MISE_RUBY_DEFAULT_PACKAGES_FILE = "{{ env.HOME }}/.local/share/ruby/default-gems"
RUBOCOP_TARGET_VERSION = "4.0"

# [hooks]
# postinstall = "{{ env.HOME }}/.local/share/mise/scripts/ruby-lsp.sh"

[settings]
# experimental = true
idiomatic_version_file_enable_tools = ["ruby"]
ruby.compile=false
