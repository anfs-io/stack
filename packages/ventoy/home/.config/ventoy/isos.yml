# Ventoy ISO catalog for `ventoy get <id>` (same format as pim's data/isos.yml)
#
#   id            name to use with `ventoy get`
#   name          description
#   url           download URL
#   filename      file name in VENTOY_ISO_DIR (default: <id>.iso, as in pim)
#   checksum      sha256:<hex>                      -- or --
#   checksum_url  checksum file that lists filename (sha256sum style, BSD "SHA256 (file) = hash", or a bare hash)
#   architecture  informational
#
# Versioned URLs stop working when a newer release ships: bump the version here when `ventoy get` reports a 404.
---
- id: debian
  name: Debian 13.7.0 amd64 netinst
  url: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.7.0-amd64-netinst.iso
  checksum_url: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS
  filename: debian-13.7.0-amd64-netinst.iso
  architecture: amd64

- id: ubuntu
  name: Ubuntu 26.04.1 LTS live server amd64
  url: https://releases.ubuntu.com/26.04/ubuntu-26.04.1-live-server-amd64.iso
  checksum_url: https://releases.ubuntu.com/26.04/SHA256SUMS
  filename: ubuntu-26.04.1-live-server-amd64.iso
  architecture: amd64

# Arch keeps this file name for every monthly release: refresh with `ventoy get arch --force`
- id: arch
  name: Arch Linux (latest monthly) x86_64
