# GlitchTip — self-hosted error tracking (Sentry-compatible).
#
# psm service: uses the shared psm postgres. Start with `psm up glitchtip`, which
# starts postgres if needed, creates the `glitchtip` database and injects
# PSM_POSTGRES_URL. All tunables live in .env.schema (the canonical var docs).
# Secrets ship with an insecure dev-only default — override them for anything shared.
name: glitchtip

x-psm:
  depends_on:
    postgres:
      database: glitchtip

services:
  valkey:
    image: ${VALKEY_IMAGE:-docker.io/valkey/valkey}:${VALKEY_TAG:-9}
    restart: unless-stopped

  web:
    image: ${GLITCHTIP_IMAGE:-docker.io/glitchtip/glitchtip}:${GLITCHTIP_TAG:-6}
    depends_on:
      - valkey
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${PSM_POSTGRES_URL:-}
      VALKEY_URL: ${GLITCHTIP_VALKEY_URL:-redis://valkey:6379}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-insecure-change-me}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      ENABLE_ADMIN: ${GLITCHTIP_ENABLE_ADMIN:-False}
      ENABLE_OPENAPI: ${GLITCHTIP_ENABLE_OPENAPI:-False}
      GLITCHTIP_ENABLE_MCP: ${GLITCHTIP_ENABLE_MCP:-False}
      GLITCHTIP_ENABLE_DUCKDB: ${GLITCHTIP_ENABLE_DUCKDB:-False}
      SERVER_ROLE: all_in_one
    restart: unless-stopped
    volumes:
      # :U chowns the host dir to the image's non-root `app` user (rootless podman)
      - ${PSM_VOLUMES_HOME}/glitchtip/uploads:/code/uploads:U
