# sshg host profiles — customize per-host colors/titles without touching the
# sshg function itself. Consumed by home/.config/zsh/ghostty.zsh.
#
# Format:  pattern | background-color | title-template
#   pattern           zsh glob, matched case-insensitively against the ssh host
#                     (the last ssh argument). First matching line wins.
#   background-color  any color Ghostty accepts via OSC 11, e.g. #4d0000
#   title-template    tab title; %h is replaced with the host
#
# Blank lines and lines starting with # are ignored. Any field may be left
# empty to keep the default. If nothing matches, sshg falls back to a blue
# background (#001a33) and the title "🖥 %h".
#
# Path is overridable via $GHOSTTY_SSHG_PROFILES.

*prod*        | #4d0000 | ⚠️ PROD: %h
*production*  | #4d0000 | ⚠️ PROD: %h
*staging*     | #3d2600 | 🔶 Stage: %h
*raspberry*   | #3d0000 | 🍓 Pi: %h
*pi*          | #3d0000 | 🍓 Pi: %h
*rpi*         | #3d0000 | 🍓 Pi: %h
