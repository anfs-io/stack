version: 0.1.1
author: rjayroach
# Linux takes podman from the distro: rootless setup and the systemd socket are wired up there
brew:
  macos: [podman, podman-compose]
system:
  # Debian only Recommends what rootless podman needs, so a host with recommends off gets a podman
  # that cannot start a container: uidmap (newuidmap/newgidmap, and the /etc/subuid files),
  # passt (pasta, podman 5's rootless network) and dbus-user-session (the systemd user session).
  # Fedora's podman Requires them, and shadow-utils ships newuidmap.
  debian: [podman, podman-compose, uidmap, passt, dbus-user-session]
  linux: [podman, podman-compose]
